<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>Detalle usuario</title>
</head>
<body>
    <h1>Detalle de usuario</h1>
    <form action="" >
        <div class="col-md-4">
            <label for="">Avatar</label>
            <img  id="avatarImg" src="" alt="Avatar">
        </div>
        <div class="col-md-2">
            <label >Nombre:</label>
            <input type="text" id="nombre" class="form-control" type="text"  readonly>
        <br>
        </div>
        <div class="col-md-2" >
            <label >Correo</label>
            <input type="text" id="email" class="form-control" type="text"  readonly>
        </div>
        
       
    </form>

    <script>
        function retornaUsuario(){
             fetch('https://reqres.in/api/users/2')
             .then(response=> {
                if(!response.ok){
                    console.log("Error en la respuesta");
                    throw new Error('Error en la respuesta: '+ response.status);                    
                }
                return response.json()
             }).then(data=>{
                console.log('Datos recibidos ', data.data);
                document.getElementById("nombre").value= data.data.first_name;
                document.getElementById("email").value= data.data.email
                document.getElementById("avatarImg").src = data.data.avatar
             }).catch(error=>{
                console.log('Hubo problema con la preticion fetch : ', error)
             });
        }

        retornaUsuario();
    </script>
</body>
</html>
