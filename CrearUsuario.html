  <div class="container mt-5">
    <h2 class="text-center mb-4">Crear Usuario</h2>

    <form id="userForm">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre</label>
        <input type="text" id="name" class="form-control" placeholder="Nombre" required />
      </div>

      <div class="mb-3">
        <label for="job" class="form-label">Puesto</label>
        <input type="text" id="job" class="form-control" placeholder="Puesto" required />
      </div>

      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>

    <div id="responseBox" class="mt-4"></div>
  </div>
<script src="js/CrearUsuario.js"></script>
